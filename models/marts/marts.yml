version: 2

models:
  - name: orders_clean
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: country
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - France
                  - Germany
                  - Italy
                  - Morocco
                  - Tunisia

  - name: orders_rejected
    columns:
      - name: order_id
        data_tests:
          - not_null

  - name: revenue_by_country
    columns:
      - name: country
        data_tests:
          - unique
          - not_null
      - name: revenue
        data_tests:
          - not_null